name: Build APK

on:
  workflow_dispatch:
    inputs:
      rilis:
        description: 'Unggah juga ke halaman Releases (mudah diunduh dari HP)'
        type: boolean
        default: true
      kunci_sementara:
        description: 'HANYA UJI: tanda tangan dengan kunci sementara (versi berikutnya tidak bisa menimpa, harus uninstall)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan kunci tanda tangan
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TEMP_KEY: ${{ inputs.kunci_sementara }}
        run: |
          set -e
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            printf '%s' "$KS_PASS" > "$RUNNER_TEMP/pass.txt"
            echo "Memakai kunci tanda tangan yang tersimpan."
          else
            if [ "$TEMP_KEY" != "true" ] && [ -z "$GH_PAT" ]; then
              echo "::error::Kunci tanda tangan belum ada. Buat secret GH_PAT (lihat PANDUAN-APK.md langkah 3) atau jalankan dengan opsi kunci_sementara untuk uji coba."
              exit 1
            fi
            PASS=$(openssl rand -hex 12)
            keytool -genkeypair -keystore "$KS" -alias cekblok -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Cek Blok, O=Plant Digital, C=ID"
            printf '%s' "$PASS" > "$RUNNER_TEMP/pass.txt"
            if [ "$TEMP_KEY" != "true" ]; then
              GH_TOKEN="$GH_PAT" gh secret set ANDROID_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY" --body "$(base64 -w0 "$KS")"
              GH_TOKEN="$GH_PAT" gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$PASS"
              echo "Kunci baru dibuat dan disimpan otomatis sebagai secret (tidak ditampilkan)."
            else
              echo "::warning::Kunci SEMENTARA dipakai. APK ini tidak bisa diperbarui di atas versi lain tanpa uninstall."
            fi
          fi

      - name: Siapkan file web
        run: |
          mkdir -p www
          cp index.html www/
          for f in manifest.json icon-192.png icon-512.png menu-hero.png; do
            if [ -f "$f" ]; then cp "$f" www/; else echo "lewati $f (tidak ada)"; fi
          done

      - name: Pasang dependensi
        run: npm install --no-audit --no-fund

      - name: Buat proyek Android
        run: npx cap add android

      - name: Izin, versi, ikon
        run: bash scripts/patch-android.sh "${{ github.run_number }}"

      - name: Sinkronkan file web
        run: npx cap sync android

      - name: Build APK (release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Tanda tangani APK
        run: |
          set -e
          PASS=$(cat "$RUNNER_TEMP/pass.txt")
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          IN=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p 4 "$IN" aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias cekblok \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out Cek-Blok.apk aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs Cek-Blok.apk | head -3
          ls -lh Cek-Blok.apk
          echo "APK dibuat: versi 1.${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Cek-Blok-APK
          path: Cek-Blok.apk
          retention-days: 30

      - name: Unggah ke Releases
        if: ${{ inputs.rilis }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Cek Blok APK v1.${{ github.run_number }}
          body: "APK Android aplikasi Cek Blok. Unduh file Cek-Blok.apk lalu pasang di HP."
          files: Cek-Blok.apk
